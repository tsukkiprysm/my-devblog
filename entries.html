---
layout: default
title: Entries
permalink: /entries/
---
<div class="padding">
    <h1 class="text_center">All entries</h1>
    <input type="search" placeholder="Search for keywords..." name="q">
    <div>
        <select name="project" id="selectProject" required>
            <option value="" disabled selected hidden>Project</option>
            <option value="lumiar">Lumiar</option>
            <option value="alquimista">O Alquimista</option>
        </select>
        <select name="year" id="selectYear" required>
            <option value="" disabled selected hidden>Year</option>
            <option value="lumiar">2026</option>
            <option value="alquimista">2025</option>
        </select>
    </div>
    <section id="entriesList">
        {% for post in site.posts %}
        <a href="{{ post.url | relative_url }}" class="box_link">
            <div class="entry_box">
                <div class="entry_text">
                    <h2>{{ post.title }}</h2>
                    <p>{{ post.date | date: "%B %d, %Y"}}</p>
                    <p class="normal_fs">{{ post.excerpt }}</p>
                </div>
                {% if post.image %}
                <img src="{{ post.image | relative_url }}" alt="">
                {% endif %}
            </div>
        </a>
        {% endfor %}
    </section>
</div>
