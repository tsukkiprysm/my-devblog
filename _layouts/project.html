<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Lily+Script+One&family=Pixelify+Sans:wght@400..700&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/estilo.css' | relative_url }}">
</head>
<body>

<div class="nav-background">
    <button id="open-nav" onclick="openNav()">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#391809"><path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"/></svg>
    </button>

    <nav id="nav">
        <button id="close-nav" onclick="closeNav()">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#391809"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg>
        </button>

        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/projects/' | relative_url }}">Projects</a>
        <p id="logo">Grazi's Devblog</p>
        <a href="{{ '/entries/' | relative_url }}">Entries</a>
        <a href="{{ '/about/' | relative_url }}">About me</a>
    </nav>
</div>

<div id="overlay" onclick="closeNav()"></div>

<main id="project_page" class="padding" style="--title-font: {{ page.title_font }}; --title-weight: {{ page.title_weight }};">
    <h1>{{ page.title }}</h1>
    <h2>{{ page.subtitle }}</h2>
    <hr class="divider">
    <img class="project_header" src="{{ page.header_img | relative_url}}">
    <hr class="divider">
        {{ content }}
    <hr class="divider">
    <h2>Site preview</h2>
    <div style="text-align: center">
        {{ page.figma_embed }}
    </div>
</main>

<footer></footer>

<script src="{{'/script.js' | relative_url}}" defer></script>
<script src="https://kit.fontawesome.com/3f84adb772.js" crossorigin="anonymous"></script>

</body>
</html>
