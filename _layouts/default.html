<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/estilo.css">
</head>
<body>

<div class="nav-background">
    <button id="open-nav" onclick="openNav()">
        <svg xmlns="http://www.w3.org/2000/svg" height="40px" viewBox="0 -960 960 960" width="40px" fill="#391809">
            <path d="M165.13-254.62q-10.68 0-17.9-7.26-7.23-7.26-7.23-18t7.23-17.86q7.22-7.13 17.9-7.13h629.74q10.68 0 17.9 7.26 7.23 7.26 7.23 18t-7.23 17.87q-7.22 7.12-17.9 7.12H165.13Z"/>
        </svg>
    </button>

    <nav id="nav">
        <button id="close-nav" onclick="closeNav()">
            <svg xmlns="http://www.w3.org/2000/svg" height="40px" viewBox="0 -960 960 960" width="40px" fill="#391809">
                <path d="m480-444.62-209.69 209.7q-7.23 7.23-17.5 7.42-10.27.19-17.89-7.42-7.61-7.62-7.61-17.7 0-10.07 7.61-17.69L444.62-480l-209.7-209.69Z"/>
            </svg>
        </button>

        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/projects/' | relative_url }}">Projects</a>
        <p id="logo">Grazi's Devblog</p>
        <a href="{{ '/entries/' | relative_url }}">Entries</a>
        <a href="{{ '/about/' | relative_url }}">About me</a>
    </nav>
</div>

<div id="overlay" onclick="closeNav()"></div>

<main>
    {{ content }}
</main>

<footer></footer>

<script src="/script.js" defer></script>

</body>
</html>
