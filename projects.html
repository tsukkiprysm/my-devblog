---
layout: default
title: Projects
permalink: /projects/
---

<div class="padding">
    <h1 class="text_center">My projects</h1>
    <section id="projectList">
        {% assign projetos_ordenados = site.projects | sort: "order" %}
        {% for project in projetos_ordenados %}
        <a href="{{ project.url | relative_url }}" class="project_box">
            <h2>{{ project.title }}</h2>
            <img src="{{ project.image | relative_url}}">
            <p class="normal_fs">{{ project.excerpt }}</p>
        </a>
        {% endfor %}
    </section>
</div>
